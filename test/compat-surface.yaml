# Not an API. Puts every shared schema on a path, as request and response, so
# `oasdiff breaking` (which only follows paths) checks each one in both directions.
openapi: 3.1.0
info:
  title: bae6 contracts compatibility surface
  version: 0.0.0
paths:
  /identity-context:
    post:
      requestBody: { required: true, content: { application/json: { schema: { $ref: "../schemas/identity-context.json" } } } }
      responses: { "200": { description: ok, content: { application/json: { schema: { $ref: "../schemas/identity-context.json" } } } } }
  /request-context:
    post:
      requestBody: { required: true, content: { application/json: { schema: { $ref: "../schemas/request-context.json" } } } }
      responses: { "200": { description: ok, content: { application/json: { schema: { $ref: "../schemas/request-context.json" } } } } }
  /error-envelope:
    post:
      requestBody: { required: true, content: { application/json: { schema: { $ref: "../schemas/error-envelope.json" } } } }
      responses: { "200": { description: ok, content: { application/json: { schema: { $ref: "../schemas/error-envelope.json" } } } } }
  /page:
    post:
      requestBody: { required: true, content: { application/json: { schema: { $ref: "../schemas/page.json" } } } }
      responses: { "200": { description: ok, content: { application/json: { schema: { $ref: "../schemas/page.json" } } } } }
  /audit-event:
    post:
      requestBody: { required: true, content: { application/json: { schema: { $ref: "../schemas/audit-event.json" } } } }
      responses: { "200": { description: ok, content: { application/json: { schema: { $ref: "../schemas/audit-event.json" } } } } }
  /capability-descriptor:
    post:
      requestBody: { required: true, content: { application/json: { schema: { $ref: "../schemas/capability-descriptor.json" } } } }
      responses: { "200": { description: ok, content: { application/json: { schema: { $ref: "../schemas/capability-descriptor.json" } } } } }
