name: ci

on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled: adding or removing `breaking` re-runs the compatibility check.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Compare with the newest release tag; a PR labelled `breaking` is for a new major.
      - id: base
        run: echo "tag=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)" >> "$GITHUB_OUTPUT"
      - if: steps.base.outputs.tag != ''
        run: git worktree add ../base "${{ steps.base.outputs.tag }}"
      # A base tag older than a file has nothing to compare it with, so that file is skipped.
      - if: steps.base.outputs.tag != '' && !contains(github.event.pull_request.labels.*.name, 'breaking')
        run: |
          for f in test/compat-surface.yaml openapi/common.yaml; do
            if [ ! -f "../base/$f" ]; then echo "skip $f: not in ${{ steps.base.outputs.tag }}"; continue; fi
            docker run --rm -v "$PWD/..:/w" -w /w tufin/oasdiff:v1.11.7 \
              breaking "base/$f" "$(basename "$PWD")/$f" --fail-on ERR
          done
